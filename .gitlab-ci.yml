# CI de sermo-mcp — rejouer la documentation servie aux IA.
#
# POURQUOI. Ce dépôt ne contient pas de logiciel : il sert de la DOCUMENTATION à
# des assistants IA. Son seul risque est de dire faux. Il a dit faux pendant des
# mois — « safe_system() impose une liste blanche de commandes autorisées »,
# alors que le code laisse tout passer par défaut — et six exemples de syntaxe
# ne démarraient pas, dont l'exemple phare du guide.
#
# Personne ne l'avait vu parce que RIEN NE REJOUAIT LA DOCUMENTATION. Deux bancs
# ont été écrits pour ça le 2026-08-30 ; sans cette CI ils ne tournent que si
# quelqu'un tape la commande, ce qui est la même faiblesse déguisée.
#
# COÛT. Un pipeline par poussée, qui compile les deux ports depuis les sources
# publiques. Ce dépôt bouge rarement. Les minutes GitLab sont comptées
# (400/mois par espace de nommage, partagées avec le projet sermo).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    # Les étiquettes AUSSI : dans le projet sermo, leur absence a laissé la
    # release v1.1.3 avec un badge rouge que plus rien ne pouvait corriger.
    - if: $CI_COMMIT_TAG

stages:
  - documentation

documentation:
  stage: documentation
  image: debian:testing
  interruptible: true
  variables:
    SERMO_GIT: "https://gitlab.com/haplo-dialog/sermo.git"
    # Les deux ports sont EXIGÉS. Sans ça, un port manquant ferait passer le
    # banc au vert en ne testant que la moitié du périmètre — en silence.
    SERMO_PORTS_REQUIS: "gtk3sermo gtk4sermo"
    # adwaita-icon-theme : son absence a fait échouer les deux jobs « exemples »
    # du projet sermo le 2026-08-29. Un contrôle vérifiait le rendu d'une icône
    # de thème sur une machine qui n'en avait aucune.
    DEPS: >-
      build-essential flex bison pkg-config ca-certificates git
      automake autoconf libtool texinfo
      libgtk-3-dev libvte-2.91-dev libgtk-layer-shell-dev
      libgtk-4-dev libvte-2.91-gtk4-dev
      xvfb xauth locales dbus-x11 fonts-dejavu-core adwaita-icon-theme
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $DEPS
    - sed -i 's/^# *fr_FR.UTF-8/fr_FR.UTF-8/' /etc/locale.gen && locale-gen
  script:
    - git clone --depth 1 "$SERMO_GIT" "$CI_BUILDS_DIR/sermo"
    - export SERMO_SRC="$CI_BUILDS_DIR/sermo"
    # Les répertoires portent la version : on la découvre, on ne la fige pas.
    - |
      for port in gtk3sermo gtk4sermo; do
        d=$(ls -d "$SERMO_SRC/$port/${port}_"*/ | grep -E '_[0-9.]+/$' | sort -V | tail -1)
        echo "=== $port : $d"
        ( cd "$d" && autoreconf -fi && ./configure && make -j"$(nproc)" )
        export PATH="${d}src:$PATH"
      done
    # Garde-fou : si un binaire manque, on le dit ICI, pas au milieu d'un banc.
    - |
      for b in gtk3sermo gtk4sermo; do
        command -v "$b" >/dev/null || { echo "ÉCHEC : $b introuvable après compilation." >&2; exit 1; }
        echo "$b -> $(command -v "$b")"
      done
    # 1. La syntaxe documentée s'analyse-t-elle ?
    - LC_ALL=fr_FR.UTF-8 LANG=fr_FR.UTF-8 ./tests/verifie-exemples.sh
    # 2. La documentation dit-elle vrai sur le code ?
    - ./tests/verifie-verite.sh
